[project]
name = "pawabase-akountz"
version = "0.1.0"
description = "Akountz: Pawabase identity and authentication service."
requires-python = ">=3.11"
license = "BSD-3-Clause"
dependencies = ["pawabase-kit", "sillo-framework[all]>=1.0.0", "sillo-oauth>=1.0.0", "pyotp>=2.9"]

[tool.uv]
package = false

[tool.uv.sources]
pawabase-kit = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
