# Pawabase, self-hosted: the server and Studio, next to Postgres, Redis and object storage.
#
#   cp .env.example .env      # then set the secrets
#   docker compose up -d
#
# Clients use the public entry point (:8080). Studio (:8090) is a separate service that manages the server over its internal listener
# (:8001, never published). It opens straight into this backend with no sign-in, so it is published on localhost only: reach it over an SSH
# tunnel, or set PAWABASE_STUDIO_USERNAME/PASSWORD, or put your own authenticating proxy in front of it before exposing it. Postgres, Redis
# and MinIO stay on the internal network.
#
# For development (live reload, no rebuilds) use docker-compose.dev.yml. For a host that already runs Postgres, use
# docker-compose.external.yml, which is only the server.

# The server's settings, shared by the three containers that run it: the server, the queue worker and the scheduler.
x-pawabase: &pawabase
  image: ${PAWABASE_IMAGE:-pawabase:local}
  init: true
  restart: unless-stopped
  env_file: .env
  environment:
    PAWABASE_APP_ENV: ${PAWABASE_APP_ENV:-production}
    # The worker and the scheduler are containers of their own below; the server starts neither.
    PAWABASE_WORKER_MODE: external
    PAWABASE_DATABASE_URL: postgres://pawabase:${POSTGRES_PASSWORD}@postgres:5432/pawabase
    PAWABASE_DEFAULT_DATA_URL: ${PAWABASE_DEFAULT_DATA_URL:-postgres://pawabase:${POSTGRES_PASSWORD}@postgres:5432/pawabase}
    PAWABASE_REDIS_URL: redis://redis:6379/0
    PAWABASE_PROJECT_NAME: ${PAWABASE_PROJECT_NAME:-Pawabase}
    # Private hosts functions may call (comma-separated). Empty keeps every private address refused.
    PAWABASE_OUTBOUND_ALLOW_HOSTS: ${PAWABASE_OUTBOUND_ALLOW_HOSTS:-}
    # File storage: the bundled MinIO unless .env points these at your own S3-compatible service (AWS S3, Cloudflare R2, Backblaze B2,
    # DigitalOcean Spaces, Wasabi, ...).
    PAWABASE_STORAGE_ENDPOINT: ${PAWABASE_STORAGE_ENDPOINT:-http://minio:9000}
    PAWABASE_STORAGE_PUBLIC_ENDPOINT: ${PAWABASE_STORAGE_PUBLIC_ENDPOINT:-${PAWABASE_STORAGE_ENDPOINT:-http://localhost:${PAWABASE_MINIO_PORT:-9000}}}
    PAWABASE_STORAGE_BUCKET: ${PAWABASE_STORAGE_BUCKET:-pawabase}
    PAWABASE_STORAGE_REGION: ${PAWABASE_STORAGE_REGION:-us-east-1}
    PAWABASE_STORAGE_ACCESS_KEY: ${PAWABASE_STORAGE_ACCESS_KEY:-${MINIO_ROOT_USER:-pawabase}}
    PAWABASE_STORAGE_SECRET_KEY: ${PAWABASE_STORAGE_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-}}
    PAWABASE_STORAGE_PATH_STYLE: ${PAWABASE_STORAGE_PATH_STYLE:-true}
    # A deployment's functions/requirements.txt is installed when it is deployed, so a function needing a library never means
    # rebuilding the image. Set to false to refuse deployments that ask for packages.
    PAWABASE_FUNCTION_INSTALL: ${PAWABASE_FUNCTION_INSTALL:-true}
    # Functions run in the `functions` service below. Empty runs them inside the server instead (one container less, no isolation
    # of the runtime from the server's credentials).
    PAWABASE_FUNCTIONS_RUNTIME_URL: ${PAWABASE_FUNCTIONS_RUNTIME_URL-http://functions:8100}
    # guarded (default): a function's fetch() goes through the platform's outbound guard. direct: workers open their own connections.
    PAWABASE_FUNCTIONS_NETWORK: ${PAWABASE_FUNCTIONS_NETWORK:-guarded}
  volumes:
    - data:/data
    - ./code:/code:ro
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    minio: { condition: service_healthy, required: false }

services:
  pawabase:
    <<: *pawabase
    build: .
    ports:
      - "${PAWABASE_GATEWAY_PORT:-8080}:8080"

  # The queue worker: runs jobs, flows and event handlers. A process of its own, so a slow job never shares the server's event loop.
  # Scale it with `docker compose up -d --scale worker=3`.
  worker:
    <<: *pawabase
    command: ["worker"]
    healthcheck:
      disable: true
    depends_on:
      pawabase: { condition: service_healthy }

  # The scheduler: fires schedules and platform housekeeping. Run exactly one.
  scheduler:
    <<: *pawabase
    command: ["scheduler"]
    healthcheck:
      disable: true
    depends_on:
      pawabase: { condition: service_healthy }

  # The functions runtime: runs deployed functions (Deno and Python workers) for the server, on the internal network only. It has no
  # database or Redis credentials and keeps no secrets: a function's secrets come from the server when its workers start, and what a
  # function does on the platform the server does with the invocation's grant. Scale it with `--scale functions=N` behind a load balancer
  # only together with a shared deployments volume; one instance serves many functions and requests at once.
  functions:
    image: ${PAWABASE_IMAGE:-pawabase:local}
    command: ["functions"]
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      PAWABASE_APP_ENV: ${PAWABASE_APP_ENV:-production}
      PAWABASE_FUNCTIONS_RUNTIME_HOST: 0.0.0.0
      PAWABASE_FUNCTIONS_API_URL: http://pawabase:8001
      PAWABASE_OUTBOUND_ALLOW_HOSTS: ${PAWABASE_OUTBOUND_ALLOW_HOSTS:-}
      PAWABASE_FUNCTIONS_NETWORK: ${PAWABASE_FUNCTIONS_NETWORK:-guarded}
      PAWABASE_FUNCTION_INSTALL: ${PAWABASE_FUNCTION_INSTALL:-true}
    volumes:
      # The deployments the server activates (it unpacks and vendors them; this service only reads them, and restores Python
      # libraries a lost volume no longer has).
      - data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # The control plane: a service of its own, managing the server over its internal listener (never published) with service tokens.
  # It has no sign-in unless PAWABASE_STUDIO_USERNAME/PASSWORD or PAWABASE_STUDIO_ACCESS_SECRET is set, so it is published on localhost only.
  studio:
    image: ${PAWABASE_IMAGE:-pawabase:local}
    command: ["studio"]
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      PAWABASE_APP_ENV: ${PAWABASE_APP_ENV:-production}
      PAWABASE_SERVER_URL: http://pawabase:8001
      PAWABASE_PROJECT_NAME: ${PAWABASE_PROJECT_NAME:-Pawabase}
    ports:
      - "127.0.0.1:${PAWABASE_STUDIO_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      pawabase: { condition: service_healthy }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pawabase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pawabase
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawabase -d pawabase"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Object storage. Pawabase creates its bucket on first start, so there is nothing to set up. The image is built from MinIO's final
  # community source release because its public registry image was withdrawn. Using your own S3-compatible service instead? Set
  # PAWABASE_STORAGE_* in .env and run `docker compose up -d --scale minio=0`.
  minio:
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
    image: pawabase-minio:local
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pawabase}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    # The S3 port is published so browsers can use presigned URLs; the console is local only.
    ports:
      - "${PAWABASE_MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${PAWABASE_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes: [minio:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  data:
  postgres:
  redis:
  minio:
