[project]
name = "pawabase-api"
version = "0.1.0"
description = "Pawabase API: projects, resources, routes, flows, events, jobs, storage and the management plane."
requires-python = ">=3.11"
license = "BSD-3-Clause"
dependencies = ["httpx>=0.27", "sillo-framework[all,storage-s3]>=1.0.0", "sillo-oauth>=1.0.0", "asyncpg>=0.29"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", ".."]
