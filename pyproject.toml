[project]
name = "pawabase"
version = "0.1.0"
description = "Pawabase: a self-hostable backend platform built on Sillo. Bring your infrastructure, build your backend."
requires-python = ">=3.11"
license = "BSD-3-Clause"
dependencies = ["httpx>=0.27"]

[project.scripts]
pawabase = "pawabase.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pawabase"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.6",
    "fakeredis[lua]>=2.26",
]

[tool.uv.workspace]
members = [
    "api",
    "akountz",
    "angula",
    "gateway",
    "studio",
]

# ``pawabase_core`` is private shared code for the self-hosted services. The
# installable ``pawabase`` wheel is the public API Kit and CLI only.
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["**/database/migrations", "**/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM105"]

[tool.ruff.lint.isort]
known-first-party = ["app", "database", "routes", "pawabase_core"]
