[project]
name = "pawabase-server"
version = "0.2.0"
description = "Pawabase: a self-hostable backend platform built on Sillo, shipped as one server. Bring your infrastructure, build your backend."
requires-python = ">=3.11"
license = "BSD-3-Clause"
dependencies = [
    "httpx>=0.27",
    "sillo-framework[all,storage-s3]>=1.0.0",
    "sillo-oauth>=1.0.0",
    "sillo-wire>=1.0.0",
    "sillo-inertia>=1.0.0",
    "asyncpg>=0.29",
    "pyotp>=2.9",
    "websockets>=12",
    # Image transformations at storage delivery (resize, crop, WebP/AVIF).
    "pillow>=11.3",
    # The Linux Docker runtime uses these explicitly for the API listeners.
    "uvloop>=0.22; sys_platform != 'win32'",
    "httptools>=0.7",
    "sqlglot>=30,<31",
]

[project.optional-dependencies]
# SAML 2.0 sign-in (the XML signature check). OpenID Connect needs nothing extra.
saml = ["signxml>=4.0"]

[project.scripts]
pawabase-server = "pawabase_server.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pawabase_server", "studio"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.6",
    "fakeredis[lua]>=2.26",
]

# ``pawabase_server`` is the self-hosted platform: one package, one process. ``studio`` is its control plane, a service of its own that manages
# the server over HTTP.
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["**/database/migrations", "**/migrations", "**/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM105"]

[tool.ruff.lint.isort]
known-first-party = ["pawabase_server", "tests"]
