# Pawabase for a host that already runs Postgres (and, optionally, Redis and S3-compatible storage): the server and Studio, nothing else.
#
#   docker compose -f docker-compose.external.yml up -d
#
# Everything infrastructural comes from environment variables, so one image serves any number of deployments that differ only in what they
# are given. Compare docker-compose.yml, which bundles Postgres, Redis and MinIO next to the server.
#
# Required:
#   PAWABASE_INTERNAL_SECRET, PAWABASE_JWT_MASTER_SECRET, PAWABASE_MASTER_KEY   32+ random characters each
#   PAWABASE_DATABASE_URL            the database, e.g. postgres://user:pw@db:5432/app (one database holds platform and identity data)
#
# Optional:
#   PAWABASE_DEFAULT_DATA_URL        where environments keep their data (default: the same database, one schema per environment).
#                                    <ENV>_DATA_URL gives one environment its own.
#   PAWABASE_REDIS_URL               without it, events, cache and queues stay inside the process (right for one container)
#   PAWABASE_STORAGE_*               S3-compatible storage; without it objects live on the `data` volume
#   PAWABASE_MAIL_*                  SMTP; without a host mail is logged, not sent
#   (delete the `studio` service to leave Studio out)
#   PAWABASE_STUDIO_ACCESS_SECRET    require a signed link to open Studio (for a hosting service that serves it)
#   <ENVIRONMENT>_*                  per-environment overrides, e.g. PRODUCTION_STORAGE_BUCKET, STAGING_MAX_USERS
#
# Sized for many small deployments on one host: no idle database connections, and a memory ceiling. Raise PAWABASE_MEMORY_LIMIT and
# PAWABASE_DB_POOL_MAX for a busy one.

services:
  pawabase:
    build: .
    image: ${PAWABASE_IMAGE:-pawabase:local}
    init: true
    restart: unless-stopped
    mem_limit: ${PAWABASE_MEMORY_LIMIT:-768m}
    cpus: ${PAWABASE_CPUS:-1.0}
    environment:
      PAWABASE_APP_ENV: production
      PAWABASE_INTERNAL_SECRET: ${PAWABASE_INTERNAL_SECRET:?set PAWABASE_INTERNAL_SECRET}
      PAWABASE_JWT_MASTER_SECRET: ${PAWABASE_JWT_MASTER_SECRET:?set PAWABASE_JWT_MASTER_SECRET}
      PAWABASE_MASTER_KEY: ${PAWABASE_MASTER_KEY:?set PAWABASE_MASTER_KEY}
      PAWABASE_PROJECT_NAME: ${PAWABASE_PROJECT_NAME:-Pawabase}
      PAWABASE_PUBLIC_URL: ${PAWABASE_PUBLIC_URL:-http://localhost:8080}
      PAWABASE_PUBLIC_GATEWAY_URL: ${PAWABASE_PUBLIC_GATEWAY_URL:-http://localhost:8080}
      PAWABASE_COOKIE_SECURE: ${PAWABASE_COOKIE_SECURE:-false}
      PAWABASE_STUDIO_ACCESS_SECRET: ${PAWABASE_STUDIO_ACCESS_SECRET:-}
      PAWABASE_DATABASE_URL: ${PAWABASE_DATABASE_URL:?set PAWABASE_DATABASE_URL}
      PAWABASE_DEFAULT_DATA_URL: ${PAWABASE_DEFAULT_DATA_URL:-${PAWABASE_DATABASE_URL}}
      PAWABASE_REDIS_URL: ${PAWABASE_REDIS_URL:-}
      PAWABASE_EXTRA_CA_B64: ${PAWABASE_EXTRA_CA_B64:-}
      # Functions run in worker processes of their own; `inprocess` runs them on the server's event loop.
      PAWABASE_FUNCTION_ISOLATION: ${PAWABASE_FUNCTION_ISOLATION:-process}
      PAWABASE_SANDBOX_MEMORY_MB: ${PAWABASE_SANDBOX_MEMORY_MB:-1024}
      # No idle connections, a small ceiling; PgBouncer 1.21+ needs no statement-cache change.
      PAWABASE_DB_POOL_MIN: ${PAWABASE_DB_POOL_MIN:-0}
      PAWABASE_DB_POOL_MAX: ${PAWABASE_DB_POOL_MAX:-3}
    env_file:
      # Everything else a deployment sets (PAWABASE_STORAGE_*, PAWABASE_MAIL_*, <ENV>_*, ...) lives in `external.env` next to this file,
      # so this file need not name every variable.
      - path: external.env
        required: false
    ports:
      - "${PAWABASE_GATEWAY_PORT:-8080}:8080"
    volumes:
      - data:/data
      - code:/code
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  studio:
    image: ${PAWABASE_IMAGE:-pawabase:local}
    command: ["studio"]
    init: true
    restart: unless-stopped
    mem_limit: 256m
    environment:
      PAWABASE_APP_ENV: production
      PAWABASE_SERVER_URL: http://pawabase:8001
      PAWABASE_INTERNAL_SECRET: ${PAWABASE_INTERNAL_SECRET:?set PAWABASE_INTERNAL_SECRET}
      PAWABASE_PROJECT_NAME: ${PAWABASE_PROJECT_NAME:-Pawabase}
      PAWABASE_PUBLIC_GATEWAY_URL: ${PAWABASE_PUBLIC_GATEWAY_URL:-http://localhost:8080}
      PAWABASE_COOKIE_SECURE: ${PAWABASE_COOKIE_SECURE:-false}
      PAWABASE_STUDIO_ACCESS_SECRET: ${PAWABASE_STUDIO_ACCESS_SECRET:-}
      PAWABASE_STUDIO_USERNAME: ${PAWABASE_STUDIO_USERNAME:-}
      PAWABASE_STUDIO_PASSWORD: ${PAWABASE_STUDIO_PASSWORD:-}
    ports:
      - "127.0.0.1:${PAWABASE_STUDIO_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      pawabase: { condition: service_healthy }

volumes:
  data:
  code:
