name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [., api, akountz, angula, gateway, studio]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages --frozen
      - name: pytest
        working-directory: ${{ matrix.package }}
        env:
          SILLO_ENV_FILE: ""
        run: uv run pytest -q tests

  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  compose:
    # Builds the image and brings up the whole stack on Postgres and Redis,
    # then checks the gateway, Studio sign-in and a request through a key.
    runs-on: ubuntu-latest
    needs: [test, studio]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          {
            echo "PAWABASE_INTERNAL_SECRET=$(openssl rand -hex 32)"
            echo "PAWABASE_JWT_MASTER_SECRET=$(openssl rand -hex 32)"
            echo "PAWABASE_MASTER_KEY=$(openssl rand -hex 32)"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
          } > .env
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test
        run: scripts/smoke.sh
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
