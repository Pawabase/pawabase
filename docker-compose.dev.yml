# Pawabase, for development: the server and Studio, with live reload.
#
#   docker compose -f docker-compose.dev.yml up
#
# The repository is bind-mounted into the containers, so a Python change restarts the server (or Studio) in a second, with no rebuild
# (rebuild with `up --build` only when pyproject.toml or uv.lock changes). Studio's front end runs on Vite with hot module reloading:
# `npm run dev` in studio/frontend, and set PAWABASE_VITE_DEV=true.
#
# Needs no .env: every secret has a development default. Create one to override.
# Studio: http://localhost:8090 (no sign-in: it manages this one backend)    Public API: http://localhost:8080

# The server's settings, shared by the three containers that run it: the server, the queue worker and the scheduler.
x-pawabase: &pawabase
  image: pawabase:dev
  init: true
  env_file:
    - path: .env
      required: false
  environment:
    WATCHFILES_FORCE_POLLING: ${WATCHFILES_FORCE_POLLING:-true}
    PAWABASE_APP_ENV: local
    # The worker and the scheduler are containers of their own below; the server starts neither.
    PAWABASE_WORKER_MODE: external
    PAWABASE_HOST: 0.0.0.0
    PAWABASE_INTERNAL_HOST: 0.0.0.0
    PAWABASE_INTERNAL_SECRET: ${PAWABASE_INTERNAL_SECRET:-dev-internal-secret-change-me-please}
    PAWABASE_JWT_MASTER_SECRET: ${PAWABASE_JWT_MASTER_SECRET:-dev-jwt-master-secret-change-me-please}
    PAWABASE_MASTER_KEY: ${PAWABASE_MASTER_KEY:-dev-master-key-change-me-please-0000}
    PAWABASE_PUBLIC_URL: http://localhost:8080
    PAWABASE_PUBLIC_GATEWAY_URL: http://localhost:8080
    PAWABASE_DATABASE_URL: postgres://pawabase:pawabase@postgres:5432/pawabase
    # Each environment's data goes in its own schema of this Postgres (the same as docker-compose.yml).
    PAWABASE_DEFAULT_DATA_URL: ${PAWABASE_DEFAULT_DATA_URL:-postgres://pawabase:pawabase@postgres:5432/pawabase}
    PAWABASE_REDIS_URL: redis://redis:6379/0
    PAWABASE_STORAGE_ROOT: /data/objects
    PAWABASE_CODE_PATH: /app/code
    PAWABASE_PROJECT_NAME: ${PAWABASE_PROJECT_NAME:-Pawabase}
    PAWABASE_OUTBOUND_ALLOW_HOSTS: ${PAWABASE_OUTBOUND_ALLOW_HOSTS:-}
    # File storage: the bundled MinIO unless .env points these at your own S3-compatible service.
    PAWABASE_STORAGE_ENDPOINT: ${PAWABASE_STORAGE_ENDPOINT:-http://minio:9000}
    PAWABASE_STORAGE_PUBLIC_ENDPOINT: ${PAWABASE_STORAGE_PUBLIC_ENDPOINT:-${PAWABASE_STORAGE_ENDPOINT:-http://localhost:9000}}
    PAWABASE_STORAGE_BUCKET: ${PAWABASE_STORAGE_BUCKET:-pawabase}
    PAWABASE_STORAGE_ACCESS_KEY: ${PAWABASE_STORAGE_ACCESS_KEY:-pawabase}
    PAWABASE_STORAGE_SECRET_KEY: ${PAWABASE_STORAGE_SECRET_KEY:-pawabase-dev-minio}
    PAWABASE_STORAGE_PATH_STYLE: ${PAWABASE_STORAGE_PATH_STYLE:-true}
  volumes:
    - .:/app
    - data:/data
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    minio: { condition: service_healthy, required: false }

services:
  pawabase:
    <<: *pawabase
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # The queue worker and the scheduler: processes of their own, restarted by the same live reload as the server.
  worker:
    <<: *pawabase
    command: ["watchfiles", "--filter", "python", "python -m pawabase_server worker", "/app/pawabase_server"]
    healthcheck:
      disable: true
    depends_on:
      pawabase: { condition: service_healthy }

  scheduler:
    <<: *pawabase
    command: ["watchfiles", "--filter", "python", "python -m pawabase_server scheduler", "/app/pawabase_server"]
    healthcheck:
      disable: true
    depends_on:
      pawabase: { condition: service_healthy }

  studio:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    image: pawabase:dev
    command: ["watchfiles", "--filter", "python", "python -m studio", "/app/studio", "/app/pawabase_server"]
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      WATCHFILES_FORCE_POLLING: ${WATCHFILES_FORCE_POLLING:-true}
      PAWABASE_APP_ENV: local
      PAWABASE_STUDIO_HOST: 0.0.0.0
      PAWABASE_SERVER_URL: http://pawabase:8001
      PAWABASE_INTERNAL_SECRET: ${PAWABASE_INTERNAL_SECRET:-dev-internal-secret-change-me-please}
      PAWABASE_PUBLIC_GATEWAY_URL: http://localhost:8080
      PAWABASE_PROJECT_NAME: ${PAWABASE_PROJECT_NAME:-Pawabase}
    volumes:
      - .:/app
    ports:
      - "8090:8090"
    depends_on:
      pawabase: { condition: service_healthy }

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pawabase
      POSTGRES_PASSWORD: pawabase
      POSTGRES_DB: pawabase
    ports: ["5432:5432"]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawabase -d pawabase"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
    image: pawabase-minio:local
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: pawabase
      MINIO_ROOT_PASSWORD: pawabase-dev-minio
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  data:
  postgres:
  minio:
